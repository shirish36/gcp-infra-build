
name: Terraform CI/CD

on:
  push:
    branches:
      - feature-exp
  pull_request:
    branches:
      - feature-exp
permissions:
  id-token: write
  contents: read
jobs:
  terraform:
    name: 'Terraform Plan and Apply'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.3.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/283962084457/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'githubaction@gifted-palace-468618-q5.iam.gserviceaccount.com'

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (Development)
        run: terraform plan -var-file=environments/dev/terraform.tfvars -input=false -lock-timeout=10m

      - name: Terraform Apply (Development)
        if: github.ref == 'refs/heads/feature-exp' && github.event_name == 'push'
        run: terraform apply -auto-approve -var-file=environments/dev/terraform.tfvars -input=false -lock-timeout=10m
