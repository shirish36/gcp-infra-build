
name: Terraform CI/CD

on:
  push:
    branches:
      - feature-exp
  pull_request:
    branches:
      - feature-exp

jobs:
  terraform:
    name: 'Terraform Plan and Apply'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env:
          - dev
          - prod
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.3.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=environments/${{ matrix.env }}/terraform.tfvars -input=false

      - name: Terraform Apply (Manual for prod)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.env == 'prod'
        run: terraform apply -auto-approve -var-file=environments/prod/terraform.tfvars -input=false

      - name: Terraform Apply (Auto for dev)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && matrix.env == 'dev'
        run: terraform apply -auto-approve -var-file=environments/dev/terraform.tfvars -input=false
