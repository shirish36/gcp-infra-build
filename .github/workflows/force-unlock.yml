name: Force Unlock Terraform State

on:
  workflow_dispatch:
    inputs:
      lock_id:
        description: 'Lock ID to force unlock'
        required: true
        default: '1755439549079697'
      environment:
        description: 'Environment (dev/prod)'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - prod

permissions:
  id-token: write
  contents: read

jobs:
  force-unlock:
    name: 'Force Unlock Terraform State'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.3.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/283962084457/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'githubaction@gifted-palace-468618-q5.iam.gserviceaccount.com'

      - name: Initialize Terraform
        run: terraform init

      - name: Force unlock Terraform state
        run: terraform force-unlock -force ${{ github.event.inputs.lock_id }}
        
      - name: Verify unlock successful
        run: terraform plan -var-file=environments/${{ github.event.inputs.environment }}/terraform.tfvars -input=false
